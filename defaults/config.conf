# Seconds before checking that the event monitor is still healthy.
WATCHDOG_INTERVAL=15

# USB ADB must be disabled for apps such as SMBC that check adb_enabled.
# This disconnects ADB while a target app is active and restores it on exit.
HIDE_USB_ADB=1
HIDE_WIRELESS_ADB=0

# Restore the saved values when the daemon stops or the module is paused.
RESTORE_ON_EXIT=1
